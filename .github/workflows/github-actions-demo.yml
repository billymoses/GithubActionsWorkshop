name: GitHub Actions Demo

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 6 * * 0'
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Print triggering event
        run: |
          echo "🎉 The job was triggered by event: ${{ github.event_name }}"
          # For pull_request events the branch name is in GITHUB_HEAD_REF.
          # For push/schedule/workflow_dispatch it's in GITHUB_REF (refs/heads/<branch>).
          if [ -n "${GITHUB_HEAD_REF}" ]; then
            BRANCH="${GITHUB_HEAD_REF}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "🔎 Branch: $BRANCH"

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: List files in the repository
        run: |
          echo "Repository ${{ github.repository }} contains:"
          # Prefer `tree` if available for a nice view, otherwise fall back to find.
          if command -v tree >/dev/null 2>&1; then
            tree -a
          else
            find . -maxdepth 3 -type d -print -o -type f -print | sed 's|^\./||'
          fi
